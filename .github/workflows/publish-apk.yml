name: Publish Debug APK Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - "apk-distribution/app-debug.apk"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate precompiled APK and SHA-256 checksum
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="apk-distribution/app-debug.apk"
          SHA_PATH="apk-distribution/app-debug.apk.sha256"

          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::APK file missing or empty at $APK_PATH"
            exit 1
          fi

          if [ ! -f "$SHA_PATH" ] || [ ! -s "$SHA_PATH" ]; then
            echo "::error::SHA-256 checksum file missing or empty at $SHA_PATH"
            exit 1
          fi

          (cd apk-distribution && sha256sum -c app-debug.apk.sha256)

          unzip -tq "$APK_PATH"

          APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          APK_BYTES="$(stat -c '%s' "$APK_PATH")"
          APK_HUMAN="$(numfmt --to=iec-i --suffix=B "$APK_BYTES" 2>/dev/null || echo "${APK_BYTES} bytes")"

          echo "sha256=${APK_SHA256}" >> "$GITHUB_OUTPUT"
          echo "size_bytes=${APK_BYTES}" >> "$GITHUB_OUTPUT"
          echo "size_human=${APK_HUMAN}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          APK_SHA256="${{ steps.validate.outputs.sha256 }}"
          APK_SIZE="${{ steps.validate.outputs.size_human }} (${{ steps.validate.outputs.size_bytes }} bytes)"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          gh release create "$RELEASE_TAG" \
            "apk-distribution/app-debug.apk#app-debug.apk" \
            --latest \
            --title "Android Debug APK (${RELEASE_TAG})" \
            --notes "$(cat <<EOF
          Precompiled Android Debug APK published automatically from \`apk-distribution/app-debug.apk\`.

          - **Release Tag:** \`${RELEASE_TAG}\`
          - **Asset Filename:** \`app-debug.apk\`
          - **APK Size:** ${APK_SIZE}
          - **SHA-256:** \`${APK_SHA256}\`
          - **Direct Latest Download:** ${DIRECT_URL}
          EOF
          )"

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"

          {
            echo "## Android Debug APK Published"
            echo ""
            echo "| Field | Value |"
            echo "| :--- | :--- |"
            echo "| **Release Tag** | \`${RELEASE_TAG}\` |"
            echo "| **APK Size** | ${APK_SIZE} |"
            echo "| **SHA-256** | \`${APK_SHA256}\` |"
            echo "| **Release Page** | ${RELEASE_URL} |"
            echo "| **Direct APK Download (Latest)** | ${DIRECT_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"
